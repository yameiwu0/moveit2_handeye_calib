virtual_fence_node:
  ros__parameters:
    # 围栏配置
    fence:
      enable: true  # 此配置同时使用围栏和多个障碍物
    fence_mode: "inclusive"
    fence_thickness: 0.02
    fence_height: 0.5
    fence_size_x: 1.0
    fence_size_y: 1.0
    fence_center_x: 0.5
    fence_center_y: 0.5
    frame_id: "base_link"

    # 障碍物配置 - 多个障碍物示例
    obstacles:
      enable: true

      # ===== 配置3个圆柱体 =====
      num_cylinders: 0

      cylinder_0:
        radius: 0.05
        height: 0.4
        x: 0.3
        y: 0.3
        z: 0.2

      cylinder_1:
        radius: 0.03
        height: 0.3
        x: 0.7
        y: 0.4
        z: 0.15

      cylinder_2:
        radius: 0.04
        height: 0.35
        x: 0.5
        y: 0.7
        z: 0.175

      # ===== 配置2个长方体 =====
      num_boxes: 2

      box_0:
        size_x: 0.15
        size_y: 0.1
        size_z: 0.08
        x: 0.4
        y: 0.5
        z: 0.04

      box_1:
        size_x: 0.2
        size_y: 0.2
        size_z: 0.1
        x: 0.6
        y: 0.6
        z: 0.05

      # ===== 配置2个球体 =====
      num_spheres: 0

      sphere_0:
        radius: 0.05
        x: 0.35
        y: 0.65
        z: 0.15

      sphere_1:
        radius: 0.04
        x: 0.65
        y: 0.35
        z: 0.12

      # ===== 配置1个圆锥体 =====
      num_cones: 0

      cone_0:
        radius: 0.06
        height: 0.25
        x: 0.5
        y: 0.5
        z: 0.125

      # ===== STL网格（如果有的话）=====
      num_meshes: 0

      # 如果要添加STL文件，取消下面的注释：
      # num_meshes: 1
      # mesh_0:
      #   file_path: "/home/zwh/models/custom_obstacle.stl"
      #   x: 0.8
      #   y: 0.8
      #   z: 0.0
      #   scale: 0.001
