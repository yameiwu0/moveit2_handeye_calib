virtual_fence_node:
  ros__parameters:
    # 围栏配置
    fence:
      enable: true  # 
    fence_mode: "exclusive"
    fence_thickness: 0.02
    fence_height: 0.32
    fence_size_x: 0.35
    fence_size_y: 0.22
    fence_center_x: -0.62
    fence_center_y: 0.0
    frame_id: "base_link"

    # 障碍物配置
    obstacles:
      enable: false

      # 圆柱体数量
      num_cylinders: 0

      # 圆柱体0: 细长柱子
      cylinder_0:
        radius: 0.03
        height: 0.3
        x: 0.2
        y: 0.15
        z: 0.15

      # 圆柱体1: 粗短柱子
      cylinder_1:
        radius: 0.05
        height: 0.15
        x: 0.4
        y: 0.4
        z: 0.075

      # 长方体数量
      num_boxes: 0

      # 长方体0: 桌面障碍物
      box_0:
        size_x: 0.37
        size_y: 0.24
        size_z: 0.44
        x: -0.58
        y: 0.16
        z: 0.21

      # 球体数量
      num_spheres: 0

      # 球体0
      sphere_0:
        radius: 0.04
        x: 0.35
        y: 0.25
        z: 0.1

      # 圆锥体数量
      num_cones: 0

      # 圆锥体0
      cone_0:
        radius: 0.05
        height: 0.2
        x: 0.15
        y: 0.25
        z: 0.1

      # STL网格数量
      num_meshes: 0

      # STL网格0 (示例，需要提供实际的STL文件路径)
      # mesh_0:
      #   file_path: "/path/to/your/model.stl"
      #   x: 0.3
      #   y: 0.3
      #   z: 0.0
      #   scale: 0.001  # STL文件的缩放比例
